:: Maximum memory, extended address element:
set cpu pdp8i
set cpu 32k
#set cpu noeae

#
# The PDP-8/I Maintenance Manual (8I-HR1A) mentions:
# maindec-8i-d01b Instruction Test 1
# maindec-8i-d02b Instruction Test 2
# maindec-08-d02a Instruction Test 2B
# maindec-08-d04b Random JMP Test
# maindec-08-d05b Random JMP/JMS Test
# maindec-08-d07b Random ISZ Test
# maindec-08-d1j0 Memory Checkerboard
# maindec-08-d1b0 Memory Address Test
# maindec-8i-d2pb Tape Reader Test
# maindec-8i-d2qb Tape Punch Test
# maindec-8i-d2rb Keyboard Test
# maindec-8i-d2tb Printer/Punch Test
#
# Curiously, maindec-08-d03b Basic JMP/JMS Test is not mentioned,
# though it is mentioned in the documentation for 08-d04b and 08-d05b
# as presumed to have already been run correctly.
#
# Appendix D of the second volume (8I-HR2A) additionally mentions:
# maindec-08-d0ua Family of 8 Random Add/Rotate Test
# maindec-08-d1eb Extended Memory Checkerboard
# maindec-08-d1gb Extended Memory Control Test
# maindec-8i-d0aa EAE Test Part 1
# maindec-8i-d0ba EAE Test Part 2
# maindec-08-d2fc High Speed Reader Test
# maindec-08-d2ge High Speed Reader/Punch Test

# As usual, many of these are newer versions of the above.
# In addition, 08-d1j0 above replaces 08-d1l0, but we only
# have the latter.
do diags/8i-d01c
do diags/8i-d02b
do diags/08-d02b
do diags/08-d04b
do diags/08-d05b
do diags/08-d07b
do diags/08-d1b0
do diags/08-d1l0
# 08-d1j0 Memory Checkerboard
# 08-d1e0 Extended Memory Checkerboard (instead?)
#do diags/8i-d2pe
#do diags/8i-d2qd
